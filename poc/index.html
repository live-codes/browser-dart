<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>@live-codes/dart-wasm · proof of concept</title>
<style>
  :root {
    --bg: #14141a;
    --panel: #1c1c24;
    --border: #2c2c38;
    --text: #e8e8ef;
    --muted: #8f8fa3;
    --accent: #17b6c4;
    --accent-dim: #0f7c86;
    --error: #ff6b6b;
    --warn: #f0c674;
    --ok: #7bd88f;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
  }

  header h1 {
    margin: 0;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.2px;
  }

  header .tag {
    padding: 2px 8px;
    border: 1px solid var(--border);
    border-radius: 999px;
    color: var(--muted);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.6px;
  }

  header .spacer { flex: 1; }

  button {
    padding: 7px 14px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: #262631;
    color: var(--text);
    font: inherit;
    font-size: 13px;
    cursor: pointer;
  }

  button:hover:not(:disabled) { background: #30303d; }

  button:disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }

  button.primary {
    border-color: var(--accent-dim);
    background: var(--accent-dim);
    color: #04191c;
    font-weight: 600;
  }

  button.primary:hover:not(:disabled) { background: var(--accent); }

  .engine {
    display: flex;
    gap: 2px;
    padding: 2px;
    border: 1px solid var(--border);
    border-radius: 7px;
    background: #1a1a22;
  }

  .engine button {
    padding: 5px 11px;
    border: 0;
    border-radius: 5px;
    background: transparent;
    color: var(--muted);
    font-size: 12px;
    font-weight: 600;
  }

  .engine button[aria-pressed="true"] {
    background: #2f2f3c;
    color: var(--text);
  }

  .engine button:disabled { opacity: 0.4; cursor: not-allowed; }

  /* Flutter renders a real app, so it needs a real viewport. */
  body[data-engine="flutter"] .sandbox iframe { height: 440px; }

  #status {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    color: var(--muted);
    font-size: 12px;
  }

  #status::before {
    content: "";
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: currentColor;
  }

  #status[data-state="busy"] { color: var(--warn); }
  #status[data-state="ok"] { color: var(--ok); }
  #status[data-state="error"] { color: var(--error); }

  main {
    flex: 1;
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: 1px;
    min-height: 0;
    background: var(--border);
  }

  .pane {
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
    background: var(--bg);
  }

  .pane > h2 {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 0;
    padding: 6px 10px 6px 14px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    color: var(--muted);
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.8px;
  }

  .pane > h2 .meta {
    margin-left: auto;
    padding-right: 4px;
    font-weight: 500;
    text-transform: none;
    letter-spacing: 0;
    color: var(--muted);
    white-space: nowrap;
  }

  #packages {
    width: 250px;
    padding: 4px 8px;
    border: 1px solid var(--border);
    border-radius: 5px;
    background: #17171e;
    color: var(--text);
    font: 12px/1.4 ui-monospace, "Cascadia Code", Consolas, monospace;
    text-transform: none;
    letter-spacing: 0;
  }

  #packages::placeholder { color: #66667a; }

  .tabs { display: flex; gap: 3px; }

  .tab {
    padding: 4px 9px;
    border: 1px solid transparent;
    border-radius: 5px;
    background: transparent;
    color: var(--muted);
    font: inherit;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    cursor: pointer;
  }

  .tab:hover { color: var(--text); }

  .tab[aria-selected="true"] {
    border-color: var(--border);
    background: #262631;
    color: var(--text);
  }

  textarea {
    flex: 1;
    width: 100%;
    padding: 14px;
    border: 0;
    outline: none;
    resize: none;
    background: transparent;
    color: var(--text);
    font: 13px/1.6 ui-monospace, "Cascadia Code", "SF Mono", Consolas, monospace;
    tab-size: 2;
  }

  .view {
    flex: 1;
    margin: 0;
    padding: 12px 14px;
    overflow: auto;
    font: 12px/1.6 ui-monospace, "Cascadia Code", "SF Mono", Consolas, monospace;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .view[hidden] { display: none; }

  #output .log { color: var(--text); }
  #output .info { color: var(--muted); }
  #output .warn { color: var(--warn); }
  #output .error { color: var(--error); }
  #output .divider {
    color: var(--accent);
    border-top: 1px solid var(--border);
    margin-top: 10px;
    padding-top: 8px;
  }

  #output:empty::before {
    content: "Press Run to compile and execute the Dart code above.";
    color: var(--muted);
  }

  #compiled, #sourcemap { color: #b9c8d4; }

  .empty {
    color: var(--muted);
    font-family: ui-sans-serif, system-ui, sans-serif;
  }

  .sandbox {
    border-top: 1px solid var(--border);
    background: var(--panel);
  }

  .sandbox iframe {
    display: block;
    width: 100%;
    height: 120px;
    border: 0;
    border-top: 1px solid var(--border);
    background: #fff;
  }

  @media (max-width: 760px) {
    main { grid-template-columns: minmax(0, 1fr); }
  }
</style>
</head>
<body data-engine="dart">
  <header>
    <h1>dart-wasm</h1>
    <span class="tag">PoC</span>
    <span class="engine" role="group" aria-label="Engine">
      <button data-engine="dart" aria-pressed="true">Dart</button>
      <button data-engine="flutter" aria-pressed="false">Flutter</button>
    </span>
    <span class="spacer"></span>
    <span id="status" data-state="idle">Not started</span>
    <button id="clear">Clear</button>
    <button id="run" class="primary">Run ▸</button>
  </header>

  <main>
    <section class="pane">
      <h2>
        main.dart
        <span class="meta">
          packages
          <input id="packages" placeholder="http, collection:^1.19.0" spellcheck="false" autocomplete="off" />
        </span>
      </h2>
      <textarea id="editor" spellcheck="false"></textarea>
    </section>
    <section class="pane">
      <h2>
        <span class="tabs" role="tablist">
          <button class="tab" role="tab" data-view="output" aria-selected="true">Console</button>
          <button class="tab" role="tab" data-view="compiled" aria-selected="false">Compiled JS</button>
          <button class="tab" role="tab" data-view="sourcemap" aria-selected="false">Source map</button>
        </span>
        <span class="meta" id="meta"></span>
      </h2>
      <pre class="view" id="output"></pre>
      <pre class="view" id="compiled" hidden></pre>
      <pre class="view" id="sourcemap" hidden></pre>
    </section>
  </main>

  <section class="sandbox pane">
    <h2>Sandbox iframe <span>compiled modules execute, and Flutter apps render, here</span></h2>
  </section>

  <script type="module">
    // Loaded as a module, so the bundle infers its asset base from `import.meta.url`:
    // dist/dart-wasm.mjs sits next to dart/ and flutter/, which is exactly what it needs.
    import { createDartpad } from '../dist/dart-wasm.mjs';

    const DART_SAMPLE = `void main() {
  print('Hello from Dart, in the browser. 🎯');

  final fibonacci = <int>[0, 1];
  while (fibonacci.length < 10) {
    fibonacci.add(fibonacci[fibonacci.length - 1] + fibonacci[fibonacci.length - 2]);
  }
  print('Fibonacci: $fibonacci');

  final squares = {for (var i = 1; i <= 5; i++) i: i * i};
  for (final entry in squares.entries) {
    print('\${entry.key}² = \${entry.value}');
  }
}
`;

    const FLUTTER_SAMPLE = `import 'package:flutter/material.dart';

void main() {
  print('Hello from Flutter! 🐦');
  runApp(const CounterApp());
}

class CounterApp extends StatefulWidget {
  const CounterApp({super.key});

  @override
  State<CounterApp> createState() => _CounterAppState();
}

class _CounterAppState extends State<CounterApp> {
  int _count = 0;

  @override
  Widget build(BuildContext context) {
    return MaterialApp(
      debugShowCheckedModeBanner: false,
      home: Scaffold(
        backgroundColor: const Color(0xFF14141A),
        body: Center(
          child: Column(
            mainAxisAlignment: MainAxisAlignment.center,
            children: [
              const Text(
                'Flutter, client-side',
                style: TextStyle(color: Color(0xFFFFFFFF), fontSize: 20),
              ),
              const SizedBox(height: 12),
              Text(
                '\$_count',
                style: const TextStyle(
                  color: Color(0xFF4AC2F7),
                  fontSize: 56,
                  fontWeight: FontWeight.bold,
                ),
              ),
              const SizedBox(height: 12),
              ElevatedButton(
                onPressed: () => setState(() => _count++),
                child: const Text('Increment'),
              ),
            ],
          ),
        ),
      ),
    );
  }
}
`;

    const SAMPLES = { dart: DART_SAMPLE, flutter: FLUTTER_SAMPLE };

    const editor = document.querySelector('#editor');
    const output = document.querySelector('#output');
    const compiled = document.querySelector('#compiled');
    const sourcemap = document.querySelector('#sourcemap');
    const meta = document.querySelector('#meta');
    const runButton = document.querySelector('#run');
    const clearButton = document.querySelector('#clear');
    const status = document.querySelector('#status');
    const sandboxContainer = document.querySelector('.sandbox');
    const packagesInput = document.querySelector('#packages');
    const tabs = [...document.querySelectorAll('.tab')];
    const engineButtons = [...document.querySelectorAll('.engine button')];

    let engine = 'dart';
    let dartpad = null;
    let modules = [];

    editor.value = SAMPLES[engine];

    function setStatus(text, state = 'idle') {
      status.textContent = text;
      status.dataset.state = state;
    }

    function appendOutput(kind, text) {
      if (!text) return;
      const line = document.createElement('div');
      line.className = kind;
      line.textContent = text;
      output.append(line);
      output.scrollTop = output.scrollHeight;
    }

    function showView(name) {
      for (const tab of tabs) {
        tab.setAttribute('aria-selected', String(tab.dataset.view === name));
      }
      output.hidden = name !== 'output';
      compiled.hidden = name !== 'compiled';
      sourcemap.hidden = name !== 'sourcemap';
    }

    const formatBytes = (bytes) => `${(bytes / 1024).toFixed(1)} KB`;

    function renderModules() {
      if (modules.length === 0) {
        compiled.innerHTML = '<span class="empty">Run some code to see the JavaScript DDC emits.</span>';
        sourcemap.innerHTML = '<span class="empty">No source map yet.</span>';
        meta.textContent = '';
        return;
      }

      compiled.textContent = modules
        .map((module) => module.code)
        .join('\n\n/* ─────────── next module ─────────── */\n\n');
      compiled.scrollTop = 0;

      const module = modules[modules.length - 1];
      const map = module.map;
      const sources = map?.sources ?? [];

      if (map) {
        sourcemap.textContent = JSON.stringify(map, null, 2);
        sourcemap.scrollTop = 0;
      } else {
        sourcemap.innerHTML =
          '<span class="empty">This module carries no inline source map.<br><br>' +
          'DDC registers one via <code>setSourceMap("main", &lt;json&gt;)</code>; ' +
          'builds before dartpad 0.0.7 passed <code>null</code> here instead.</span>';
      }

      const count = `${modules.length} module${modules.length === 1 ? '' : 's'}`;
      if (map) {
        const label = sources.map((source) => source.replace(/^.*\//, '')).join(', ');
        meta.textContent =
          `${count} · ${formatBytes(module.code.length)} · source map → ` +
          `${sources.length} source${sources.length === 1 ? '' : 's'} (${label})`;
      } else {
        meta.textContent = `${count} · ${formatBytes(module.code.length)} · no source map`;
      }
    }

    /** "http, collection:^1.19.0" -> ['http', 'collection:^1.19.0'] */
    const parseDependencies = (text) =>
      text
        .split(',')
        .map((entry) => entry.trim())
        .filter(Boolean);

    async function boot() {
      setStatus(
        engine === 'flutter' ? 'Downloading Flutter toolchain (225 MB)…' : 'Downloading Dart toolchain…',
        'busy',
      );
      return createDartpad({
        engine,
        container: sandboxContainer,
        onConsole: ({ message }) => appendOutput('log', message),
        onError: ({ message }) => appendOutput('error', message),
        onLog: ({ message }) => appendOutput('info', message),
        onModule: (module) => {
          modules.push(module);
          renderModules();
        },
      });
    }

    async function run() {
      runButton.disabled = true;
      try {
        dartpad ??= await boot();

        modules = [];
        renderModules();
        appendOutput('divider', `Run · ${new Date().toLocaleTimeString()} (${engine})`);
        setStatus('Compiling…', 'busy');

        // `run` writes the pubspec, resolves it when it changed, then compiles and executes.
        await dartpad.run(editor.value, { dependencies: parseDependencies(packagesInput.value) });

        setStatus('Ready', 'ok');
      } catch (error) {
        appendOutput('error', error?.message ?? String(error));
        setStatus('Error', 'error');
      } finally {
        runButton.disabled = false;
      }
    }

    async function setEngine(next) {
      if (next === engine) return;
      engine = next;
      document.body.dataset.engine = engine;

      for (const button of engineButtons) {
        button.setAttribute('aria-pressed', String(button.dataset.engine === engine));
      }

      // A worker is bound to one asset directory, so switching engines tears the current
      // one down; the next Run boots the other.
      if (dartpad) {
        await dartpad.dispose().catch(() => {});
        dartpad = null;
      }
      modules = [];
      renderModules();
      editor.value = SAMPLES[engine];
      setStatus('Not started');
    }

    /** Flutter assets are ~225 MB and opt-in, so only enable the toggle when they exist. */
    async function checkFlutterAssets() {
      const button = engineButtons.find((candidate) => candidate.dataset.engine === 'flutter');
      const probe = new URL('../dist/flutter/worker.js', import.meta.url);
      const response = await fetch(probe, { method: 'HEAD' }).catch(() => null);
      if (!response?.ok) {
        button.disabled = true;
        button.title = 'Not vendored. Run: npm run fetch';
      }
    }

    for (const tab of tabs) {
      tab.addEventListener('click', () => showView(tab.dataset.view));
    }

    for (const button of engineButtons) {
      button.addEventListener('click', () => setEngine(button.dataset.engine));
    }

    runButton.addEventListener('click', run);
    clearButton.addEventListener('click', () => {
      output.textContent = '';
    });

    editor.addEventListener('keydown', (event) => {
      if (event.key === 'Tab') {
        event.preventDefault();
        const { selectionStart, selectionEnd, value } = editor;
        editor.value = `${value.slice(0, selectionStart)}  ${value.slice(selectionEnd)}`;
        editor.selectionStart = editor.selectionEnd = selectionStart + 2;
      } else if (event.key === 'Enter' && (event.metaKey || event.ctrlKey)) {
        event.preventDefault();
        run();
      }
    });

    renderModules();
    checkFlutterAssets();
  </script>
</body>
</html>
